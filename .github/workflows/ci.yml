name: ci
on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate public/legacy site layout
      shell: bash
      run: |
        set -e
        # public/ is the only thing Netlify serves (see netlify.toml) and
        # must be the retirement page pointing at the canonical production
        # Worker, not a revived copy of the old demo-1/static-widget site.
        test -f public/index.html
        grep -q "prooflens-production.prooflens-web.workers.dev" public/index.html
        # The old site is preserved for history under legacy/site/ only.
        test -f legacy/site/demo-embed.html
        test -f legacy/site/verify.html
        test -f legacy/site/signer.html
        # It must never come back live at the repo root or under Netlify's
        # published directory.
        for f in demo-embed.html verify.html embed.html signer.html showcase.html pricing.html success.html; do
          if [ -f "$f" ]; then
            echo "Legacy demo page $f must not exist at repo root" >&2
            exit 1
          fi
          if [ -f "public/$f" ]; then
            echo "Legacy demo page $f must not be published by Netlify" >&2
            exit 1
          fi
        done
        echo "Public/legacy site layout OK."

  history:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Verify imported history
      run: node scripts/verify-phase0-history.mjs

  check:
    name: Phase 5 core acceptance
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/setup@v2
      with:
        runtime: node@24
        cache: true
        install: false
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install Python interoperability dependency
      run: python -m pip install --upgrade "cryptography>=44"
    - name: Install workspace from lockfile
      run: pnpm install --frozen-lockfile
    - name: Generate Worker runtime types
      run: pnpm --filter @prooflens/web types
    - name: Install Chromium, Firefox, and WebKit
      run: pnpm exec playwright install --with-deps chromium firefox webkit
    - name: Run Phase 5 core acceptance checks
      run: pnpm check

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: pnpm/setup@v2
      with:
        runtime: node@24
        cache: true
        install: false
    - name: Install workspace from lockfile
      run: pnpm install --frozen-lockfile
    - name: Scan dependencies for high-severity advisories
      run: pnpm audit --audit-level high
    - name: Scan Git history for secrets
      run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact /repo
