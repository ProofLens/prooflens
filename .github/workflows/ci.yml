name: ci
on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Sanity check site files
      shell: bash
      run: |
        set -e
        # Accept either root or site/ layout to be robust
        if [ -f demo-embed.html ]; then
          echo "Found root-level pages."
          test -f demo-embed.html
          test -f verify.html
        elif [ -f site/demo-embed.html ]; then
          echo "Found site/ pages."
          test -f site/demo-embed.html
          test -f site/verify.html
        else
          echo "Could not find demo-embed.html or verify.html" >&2
          exit 1
        fi
        echo "Site sanity OK."

  history:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Verify imported history
      run: node scripts/verify-phase0-history.mjs

  check:
    name: Phase 5 core acceptance
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/setup@v2
      with:
        runtime: node@24
        cache: true
        install: false
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install Python interoperability dependency
      run: python -m pip install --upgrade "cryptography>=44"
    - name: Install workspace from lockfile
      run: pnpm install --frozen-lockfile
    - name: Generate Worker runtime types
      run: pnpm --filter @prooflens/web types
    - name: Install Chromium, Firefox, and WebKit
      run: pnpm exec playwright install --with-deps chromium firefox webkit
    - name: Run Phase 5 core acceptance checks
      run: pnpm check

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: pnpm/setup@v2
      with:
        runtime: node@24
        cache: true
        install: false
    - name: Install workspace from lockfile
      run: pnpm install --frozen-lockfile
    - name: Scan dependencies for high-severity advisories
      run: pnpm audit --audit-level high
    - name: Scan Git history for secrets
      run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact /repo
